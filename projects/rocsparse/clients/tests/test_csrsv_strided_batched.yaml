---
include: rocsparse_common.yaml


Definitions:
  - &M_N_range_quick
    - { M:  50, N:  50 }
    - { M: 187, N: 187 }


  - &M_N_range_checkin
    - { M:   0, N:   0 }
    - { M:   1, N:   1 }
    - { M:   2, N:   2 }
    - { M:  79, N:  79 }
    - { M: 141, N: 141 }

  - &M_N_range_nightly
    - { M:   9381, N:   9381 }
    - { M:  37017, N:  37017 }

  - &alpha_range_quick
    - { alpha:   1.0, alphai: -0.2 }
    - { alpha:  -0.5, alphai:  0.1 }

  - &alpha_range_checkin
    - { alpha:   2.0, alphai:  0.0 }
    - { alpha:   0.0, alphai:  0.5 }
    - { alpha:   3.0, alphai: -1.0 }

  - &alpha_range_nightly
    - { alpha:   0.0,  alphai: -0.75 }
    - { alpha:   0.25, alphai:  0.0 }
    - { alpha:  -0.75, alphai:  0.25 }

Tests:
- name: csrsv_strided_batched_bad_arg
  category: pre_checkin
  function: csrsv_strided_batched_bad_arg
  precision: *single_double_precisions_complex_real

- name: csrsv_strided_batched
  category: pre_checkin
  function: csrsv_strided_batched
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_checkin
  alpha_alphai: *alpha_range_checkin
  transA: *all_rocsparse_operation
  diag: *all_rocsparse_diag_type
  uplo: *all_rocsparse_fill_mode
  apol: *all_rocsparse_analysis_policy
  spol: *all_rocsparse_solve_policy
  baseA: *all_rocsparse_index_base
  matrix: [rocsparse_matrix_random]
  batch_count_A: [0, 1, 2, 8]

- name: csrsv_strided_batched
  category: quick
  function: csrsv_strided_batched
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_quick
  alpha_alphai: *alpha_range_quick
  transA: *all_rocsparse_operation
  diag: *all_rocsparse_diag_type
  uplo: *all_rocsparse_fill_mode
  apol: *all_rocsparse_analysis_policy
  spol: *all_rocsparse_solve_policy
  baseA: *all_rocsparse_index_base
  matrix: [rocsparse_matrix_random]
  batch_count_A: [4]

- name: csrsv_strided_batched
  category: nightly
  function: csrsv_strided_batched
  precision: *single_double_precisions_complex_real
  M_N: *M_N_range_nightly
  alpha_alphai: *alpha_range_quick
  transA: *all_rocsparse_operation
  diag: *all_rocsparse_diag_type
  uplo: *all_rocsparse_fill_mode
  apol: *all_rocsparse_analysis_policy
  spol: *all_rocsparse_solve_policy
  baseA: *all_rocsparse_index_base
  matrix: [rocsparse_matrix_random]
  batch_count_A: [16, 32]
